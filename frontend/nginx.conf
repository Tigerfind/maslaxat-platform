server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://zoom.us https://*.zoom.us https://accounts.google.com https://telegram.org; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; frame-src 'self' https://zoom.us https://*.zoom.us https://accounts.google.com https://oauth.telegram.org;" always;

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /api {
    proxy_pass http://emaslaxat-api:3001;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /socket.io/ {
    proxy_pass http://emaslaxat-api:3001/socket.io/;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
