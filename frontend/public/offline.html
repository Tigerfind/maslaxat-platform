<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B8956E">
  <title>MaslaXat - Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F5F1EB;color:#29231E}.card{width:min(100%,520px);padding:clamp(24px,7vw,44px);border:1px solid #D8C8B5;border-radius:22px;background:rgba(255,255,255,.82);box-shadow:0 18px 55px rgba(66,49,31,.12);text-align:center}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#B8956E,#806447);color:#fff;font-size:30px}h1{margin:0 0 10px;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:500}p{margin:0 0 24px;color:#66594D}button{min-width:44px;min-height:44px;padding:10px 18px;border:0;border-radius:10px;background:#2E2924;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:focus-visible{outline:3px solid #B8956E;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">M</div>
    <h1 id="title">Нет подключения</h1>
    <p id="message">Проверьте интернет и попробуйте снова. Личные данные не сохраняются на этой странице.</p>
    <button type="button" onclick="location.reload()" id="retry">Повторить</button>
  </main>
  <script>
    const copy={uz:{title:'Internet aloqasi yo‘q',message:'Internetni tekshiring va qayta urinib ko‘ring. Shaxsiy ma’lumotlar bu sahifada saqlanmaydi.',retry:'Qayta urinish'},en:{title:'You are offline',message:'Check your connection and try again. No private data is stored on this page.',retry:'Try again'}};try{const lang=localStorage.getItem('language');if(copy[lang]){document.documentElement.lang=lang;for(const key of Object.keys(copy[lang]))document.getElementById(key).textContent=copy[lang][key]}}catch(e){}
  </script>
</body>
</html>
