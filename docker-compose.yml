version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:14
    container_name: maslaxat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maslaxat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - maslaxat-network

  redis:
    image: redis:6-alpine
    container_name: maslaxat-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - maslaxat-network

  elasticsearch:
    image: elasticsearch:8.8.0
    container_name: maslaxat-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - maslaxat-network

  # API Gateway
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: maslaxat-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # Authentication Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: maslaxat-auth
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # Consultation Service
  consultation-service:
    build:
      context: ./backend/consultation-service
      dockerfile: Dockerfile
    container_name: maslaxat-consultation
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # Video Service
  video-service:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: maslaxat-video
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # Payment Service
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: maslaxat-payment
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID}
      - UZCARD_MERCHANT_ID=${UZCARD_MERCHANT_ID}
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # AI Service
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: maslaxat-ai
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
    networks:
      - maslaxat-network

  # Document Service
  document-service:
    build:
      context: ./backend/document-service
      dockerfile: Dockerfile
    container_name: maslaxat-document
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    depends_on:
      - postgres
    networks:
      - maslaxat-network

  # Notification Service
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: maslaxat-notification
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - postgres
      - redis
    networks:
      - maslaxat-network

  # Analytics Service
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: maslaxat-analytics
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - maslaxat-network

  # Monitoring Service
  monitoring-service:
    build:
      context: ./backend/monitoring-service
      dockerfile: Dockerfile
    container_name: maslaxat-monitoring
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/maslaxat
    depends_on:
      - postgres
    networks:
      - maslaxat-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maslaxat-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_SOCKET_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - maslaxat-network

  # Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: maslaxat-admin
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_SOCKET_URL=http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - gateway
    networks:
      - maslaxat-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: maslaxat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - admin
      - gateway
    networks:
      - maslaxat-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  maslaxat-network:
    driver: bridge