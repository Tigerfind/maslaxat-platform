name: Monthly database restore drill

on:
  schedule:
    - cron: '43 4 1 * *'
  workflow_dispatch:
    inputs:
      backup_id:
        description: Signed backup ID; blank selects the newest committed triplet
        required: false
        type: string
      incident_epoch:
        description: Incident declaration Unix epoch; blank uses immutable workflow dispatch created_at
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: database-restore-drill
  cancel-in-progress: false

jobs:
  validate-images:
    runs-on: ubuntu-24.04
    outputs:
      tool_image: ${{ steps.images.outputs.tool_image }}
      postgres_image: ${{ steps.images.outputs.postgres_image }}
      redis_image: ${{ steps.images.outputs.redis_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: images
        env:
          BACKUP_TOOL_IMAGE_DIGEST: ${{ vars.BACKUP_TOOL_IMAGE_DIGEST }}
          RESTORE_POSTGRES_IMAGE_DIGEST: ${{ vars.RESTORE_POSTGRES_IMAGE_DIGEST }}
          RESTORE_REDIS_IMAGE_DIGEST: ${{ vars.RESTORE_REDIS_IMAGE_DIGEST }}
        run: |
          node deployment/scripts/validate-image-reference.js "$BACKUP_TOOL_IMAGE_DIGEST" "$RESTORE_POSTGRES_IMAGE_DIGEST" "$RESTORE_REDIS_IMAGE_DIGEST"
          printf 'tool_image=%s\npostgres_image=%s\nredis_image=%s\n' \
            "$BACKUP_TOOL_IMAGE_DIGEST" "$RESTORE_POSTGRES_IMAGE_DIGEST" "$RESTORE_REDIS_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  restore:
    needs: validate-images
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    container:
      image: ${{ needs.validate-images.outputs.tool_image }}
    timeout-minutes: 115
    environment: restore-drill
    services:
      postgres:
        image: ${{ needs.validate-images.outputs.postgres_image }}
        env:
          POSTGRES_PASSWORD: restore-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ needs.validate-images.outputs.redis_image }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      BACKUP_PREFIX: postgres
      BACKUP_R2_ENDPOINT: ${{ vars.BACKUP_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RESTORE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.RESTORE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_R2_SECRET_ACCESS_KEY }}
      R2_PRIVATE_BUCKET: ${{ vars.BACKUP_BUCKET }}
      FILE_STORAGE_WRITE_MODE: r2
      RESTORE_DATABASE_MARKER: EMASLAXAT_RESTORE_DRILL_EMPTY_V1
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RESTORE_ALLOWED_HOSTS: postgres
      RESTORE_EXPECTED_SERVER_PORT: '5432'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate immutable execution images
        env:
          BACKUP_TOOL_IMAGE_DIGEST: ${{ vars.BACKUP_TOOL_IMAGE_DIGEST }}
          RESTORE_POSTGRES_IMAGE_DIGEST: ${{ vars.RESTORE_POSTGRES_IMAGE_DIGEST }}
          RESTORE_REDIS_IMAGE_DIGEST: ${{ vars.RESTORE_REDIS_IMAGE_DIGEST }}
        run: node deployment/scripts/validate-image-reference.js "$BACKUP_TOOL_IMAGE_DIGEST" "$RESTORE_POSTGRES_IMAGE_DIGEST" "$RESTORE_REDIS_IMAGE_DIGEST"
      - name: Resolve incident or dispatch epoch
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_INCIDENT_EPOCH: ${{ inputs.incident_epoch }}
        run: |
          started_epoch="$REQUESTED_INCIDENT_EPOCH"
          if [ -z "$started_epoch" ]; then
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            started_epoch=$(date -u -d "$created_at" +%s)
          fi
          [[ "$started_epoch" =~ ^[0-9]+$ ]]
          [ "$started_epoch" -le "$(date -u +%s)" ]
          mkdir -p "$RUNNER_TEMP/restore-evidence"
          printf 'RESTORE_STARTED_EPOCH=%s\n' "$started_epoch" >> "$GITHUB_ENV"
      - name: Install locked backend dependencies and record tool versions
        timeout-minutes: 15
        run: |
          npm --prefix backend/api ci --ignore-scripts
          versions="$(psql --version);$(age --version 2>&1 | head -n 1);$(openssl version);$(aws --version);node $(node --version)"
          printf 'RESTORE_RUNTIME_VERSIONS=%s\n' "$versions" >> "$GITHUB_ENV"
      - name: Create isolated empty marker database
        timeout-minutes: 5
        env:
          PGPASSWORD: restore-only-password
        run: |
          database="emaslaxat_restore_drill_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb --host=postgres --username=postgres "$database"
          psql --host=postgres --username=postgres --dbname="$database" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE restore_drill_marker (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO restore_drill_marker VALUES (1, 'EMASLAXAT_RESTORE_DRILL_EMPTY_V1');
          SQL
          printf 'RESTORE_DATABASE_URL=postgres://postgres:restore-only-password@postgres:5432/%s\n' "$database" >> "$GITHUB_ENV"
          server_addr=$(psql --host=postgres --username=postgres --dbname="$database" --tuples-only --no-align \
            --command="SELECT host(inet_server_addr())")
          cluster_id=$(psql --host=postgres --username=postgres --dbname="$database" --tuples-only --no-align \
            --command="SELECT system_identifier FROM pg_control_system()")
          printf 'RESTORE_EXPECTED_SERVER_ADDR=%s\n' "$server_addr" >> "$GITHUB_ENV"
          printf 'RESTORE_EXPECTED_DATABASE=%s\n' "$database" >> "$GITHUB_ENV"
          printf 'RESTORE_EXPECTED_CLUSTER_ID=%s\n' "$cluster_id" >> "$GITHUB_ENV"
      - name: Select committed backup triplet
        timeout-minutes: 5
        env:
          REQUESTED_BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          backup_id="$REQUESTED_BACKUP_ID"
          if [ -z "$backup_id" ]; then
            inventory="$RUNNER_TEMP/restore-backup-objects.txt"
            node deployment/scripts/list-r2-backup-objects.js \
              "$BACKUP_BUCKET" "$BACKUP_R2_ENDPOINT" "$BACKUP_PREFIX/" > "$inventory"
            newest=''
            while IFS= read -r key; do
              [[ "$key" == "$BACKUP_PREFIX/"*.manifest.sig ]] || continue
              candidate="${key##*/}"
              candidate="${candidate%.manifest.sig}"
              [[ "$candidate" =~ ^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+$ ]] || exit 66
              [[ -z "$newest" || "$candidate" > "$newest" ]] && newest="$candidate"
            done < "$inventory"
            backup_id="$newest"
          fi
          [[ "$backup_id" =~ ^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+$ ]]
          printf 'BACKUP_ID=%s\n' "$backup_id" >> "$GITHUB_ENV"
      - name: Materialize restore-only keys
        timeout-minutes: 2
        env:
          BACKUP_AGE_IDENTITY_B64: ${{ secrets.BACKUP_AGE_IDENTITY_B64 }}
          BACKUP_MANIFEST_VERIFY_KEYRING_JSON: ${{ secrets.BACKUP_MANIFEST_VERIFY_KEYRING_JSON }}
          BACKUP_MANIFEST_ALLOWED_KEY_IDS: ${{ vars.BACKUP_MANIFEST_ALLOWED_KEY_IDS }}
          RESTORE_EVIDENCE_SIGNING_KEY_B64: ${{ secrets.RESTORE_EVIDENCE_SIGNING_KEY_B64 }}
        run: |
          identity="$RUNNER_TEMP/backup-age-identity.txt"
          keyring="$RUNNER_TEMP/backup-manifest-keyring"
          evidence_key="$RUNNER_TEMP/restore-evidence-signing.pem"
          printf '%s' "$BACKUP_AGE_IDENTITY_B64" | base64 --decode > "$identity"
          node deployment/scripts/materialize-backup-keyring.js "$keyring" \
            "$BACKUP_MANIFEST_ALLOWED_KEY_IDS" "$BACKUP_MANIFEST_VERIFY_KEYRING_JSON"
          printf '%s' "$RESTORE_EVIDENCE_SIGNING_KEY_B64" | base64 --decode > "$evidence_key"
          chmod 600 "$identity" "$evidence_key"
          printf 'BACKUP_AGE_IDENTITY_FILE=%s\n' "$identity" >> "$GITHUB_ENV"
          printf 'BACKUP_MANIFEST_VERIFY_KEYRING_DIR=%s\n' "$keyring" >> "$GITHUB_ENV"
          printf 'BACKUP_MANIFEST_ALLOWED_KEY_IDS=%s\n' "$BACKUP_MANIFEST_ALLOWED_KEY_IDS" >> "$GITHUB_ENV"
          printf 'RESTORE_EVIDENCE_SIGNING_KEY_FILE=%s\n' "$evidence_key" >> "$GITHUB_ENV"
          printf 'RESTORE_EVIDENCE_SIGNING_KEY_ID=%s\n' '${{ vars.RESTORE_EVIDENCE_SIGNING_KEY_ID }}' >> "$GITHUB_ENV"
      - name: Restore and run backend pg smoke
        timeout-minutes: 85
        env:
          RESTORE_EVIDENCE_DIR: ${{ runner.temp }}/restore-evidence
        run: bash deployment/scripts/restore-drill.sh
      - name: Upload restore evidence for approval
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-evidence/*
          if-no-files-found: warn
          retention-days: 365
      - name: Remove restore keys
        if: always()
        timeout-minutes: 2
        run: rm -rf "$RUNNER_TEMP/backup-age-identity.txt" "$RUNNER_TEMP/backup-manifest-keyring" "$RUNNER_TEMP/restore-evidence-signing.pem"

  finalize-evidence:
    needs: [validate-images, restore]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    container:
      image: ${{ needs.validate-images.outputs.tool_image }}
    timeout-minutes: 10
    environment: restore-drill-finalization
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate immutable execution image
        env:
          BACKUP_TOOL_IMAGE_DIGEST: ${{ vars.BACKUP_TOOL_IMAGE_DIGEST }}
        run: node deployment/scripts/validate-image-reference.js "$BACKUP_TOOL_IMAGE_DIGEST"
      - name: Download primary restore evidence when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: restore-drill-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-primary
      - name: Materialize independent finalizer signing key
        env:
          RESTORE_FINALIZER_SIGNING_KEY_B64: ${{ secrets.RESTORE_FINALIZER_SIGNING_KEY_B64 }}
          RESTORE_EVIDENCE_VERIFY_KEY_B64: ${{ secrets.RESTORE_EVIDENCE_VERIFY_KEY_B64 }}
        run: |
          key="$RUNNER_TEMP/restore-finalizer-signing.pem"
          primary_verify="$RUNNER_TEMP/restore-evidence-verify.pem"
          printf '%s' "$RESTORE_FINALIZER_SIGNING_KEY_B64" | base64 --decode > "$key"
          printf '%s' "$RESTORE_EVIDENCE_VERIFY_KEY_B64" | base64 --decode > "$primary_verify"
          chmod 600 "$key" "$primary_verify"
          printf 'RESTORE_FINALIZER_SIGNING_KEY_FILE=%s\n' "$key" >> "$GITHUB_ENV"
          printf 'RESTORE_PRIMARY_EVIDENCE_VERIFY_KEY_FILE=%s\n' "$primary_verify" >> "$GITHUB_ENV"
      - name: Resolve incident epoch and finalize independent evidence
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_INCIDENT_EPOCH: ${{ inputs.incident_epoch }}
          RESTORE_JOB_RESULT: ${{ needs.restore.result }}
          RESTORE_RUN_ID: ${{ github.run_id }}
          RESTORE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RESTORE_REPOSITORY: ${{ github.repository }}
          RESTORE_GIT_REF: ${{ github.ref }}
          RESTORE_COMMIT_SHA: ${{ github.sha }}
          REQUESTED_BACKUP_ID: ${{ inputs.backup_id }}
          RESTORE_FINALIZER_SIGNING_KEY_ID: ${{ vars.RESTORE_FINALIZER_SIGNING_KEY_ID }}
          RESTORE_EVIDENCE_DIR: ${{ runner.temp }}/restore-finalizer
        run: |
          incident_epoch="$REQUESTED_INCIDENT_EPOCH"
          if [ -z "$incident_epoch" ]; then
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            incident_epoch=$(date -u -d "$created_at" +%s)
          fi
          shopt -s nullglob
          primary_files=("$RUNNER_TEMP"/restore-primary/*.evidence)
          primary="${primary_files[0]:-}"
          backup_id="${REQUESTED_BACKUP_ID:-unknown}"
          if [ -n "$primary" ]; then
            backup_id=$(awk -F= '$1 == "backup_id" { print substr($0,index($0,"=")+1) }' "$primary")
          fi
          RESTORE_INCIDENT_EPOCH="$incident_epoch" RESTORE_BACKUP_ID="$backup_id" \
            RESTORE_PRIMARY_EVIDENCE_FILE="$primary" \
            RESTORE_PRIMARY_EVIDENCE_VERIFY_KEY_FILE="${RESTORE_PRIMARY_EVIDENCE_VERIFY_KEY_FILE:-}" \
            bash .github/scripts/restore-evidence-finalizer.sh
      - name: Upload independent finalizer evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-finalizer-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-finalizer/*
          if-no-files-found: warn
          retention-days: 365
