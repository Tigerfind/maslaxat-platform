name: Staging gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-foundation:
    uses: ./.github/workflows/ci.yml

  session-b-quality-gates:
    needs: release-foundation
    uses: ./.github/workflows/quality-gates.yml
    with:
      run_staging: true
      confirm_non_production: STAGING-ONLY
    secrets: inherit
